<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
     integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
     <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card bg-dark mt-4">
                    <div class="card-header bg-warning">
                        <h2>Todo Form!</h2>
                    </div>
                    <div class="card-body">
                        <form id="tform">
                            <div class="form-group">
                                <label for="tinput" class="text-white">Enter your favorite Dish :</label>
                                <input required type="text" id="tinput" class="form-control">
                            </div>
                            <button type="submit" id="addbtn" class="btn btn-sm btn-warning">Add</button>
                            <button type="button" id="updatebtn" class="btn btn-sm btn-warning d-none">Update</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <ul id="todocontainer" class="mt-4">
                    <!-- <li class="list-group-item d-flex justify-content-between">
                        <strong>Dosa</strong>
                       <div>
                         <button class="btn btn-sm btn-dark">Edit</button>
                        <button class="btn btn-sm btn-warning">Delete</button>
                       </div>
                    </li> -->
                </ul>
            </div>
        </div>
    </div>

    <div class="spinner" id="spinner">
        <div class="spinner-border" role="status">
       <span class="sr-only">Loading...</span></div>
    </div> 

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./app.js"></script>
</body>
</html>
